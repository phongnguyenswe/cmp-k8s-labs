name: Build image and update desired state

on:
  push:
    branches: [part-4]
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: part-4-image-update
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: part-4
          fetch-depth: 0

      - name: Set immutable image tag
        id: vars
        shell: bash
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ steps.vars.outputs.tag }}

      - name: Update development image tag
        uses: mikefarah/yq@v4
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        with:
          cmd: yq -i '.image.tag = strenv(TAG)' deploy/helm/demo-app/values-dev.yaml

      - name: Commit development desired state when changed
        shell: bash
        run: |
          if git diff --quiet -- deploy/helm/demo-app/values-dev.yaml; then
            echo "Development already references this image."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add deploy/helm/demo-app/values-dev.yaml
          git commit -m "chore(dev): deploy image ${{ steps.vars.outputs.tag }} [skip ci]"
          git push origin HEAD:part-4