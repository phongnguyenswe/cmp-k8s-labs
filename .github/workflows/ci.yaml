name: Build image and update desired state

on:
  push:
    branches: [part-2]
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: part-2-image-update
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: part-2
          fetch-depth: 0

      - name: Set immutable image tag
        id: vars
        shell: bash
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ steps.vars.outputs.tag }}

      - name: Update only the application image
        uses: mikefarah/yq@v4
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/demo-app:${{ steps.vars.outputs.tag }}
        with:
          cmd: yq -i '.spec.template.spec.containers[] |= select(.name == "nginx").image = strenv(IMAGE)' deploy/base/deployment.yaml

      - name: Commit desired state when changed
        shell: bash
        run: |
          if git diff --quiet -- deploy/base/deployment.yaml; then
            echo "Manifest already references this image; nothing to commit."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add deploy/base/deployment.yaml
          git commit -m "chore: deploy image ${{ steps.vars.outputs.tag }} [skip ci]"
          git push origin HEAD:part-2